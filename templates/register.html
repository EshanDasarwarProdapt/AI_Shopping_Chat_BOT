<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - DemoShop</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="/">DemoShop</a></div>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search products..." autocomplete="off">
        </div>
        <div class="nav-links">
            <a href="/login">Login</a>
            <a href="/register">Register</a>
        </div>
    </header>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Create Account</h1>
            <p class="auth-subtitle">Join DemoShop to get personalized recommendations</p>

            <script>
                const params = new URLSearchParams(window.location.search);
                if (params.get('error')) {
                    document.write('<div class="alert-error">Username already taken. Please choose another.</div>');
                }
            </script>

            <form action="/register" method="POST">
                <div class="form-group">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-input" required placeholder="Choose a username">
                </div>
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-input" required placeholder="Create a password">
                </div>
                <button type="submit" class="btn btn-primary btn-lg btn-block" style="margin-top: 0.5rem;">Create Account</button>
            </form>
            
            <p class="auth-footer">
                Already have an account? <a href="/login">Sign in</a>
            </p>
        </div>
    </div>
</body>
</html>
